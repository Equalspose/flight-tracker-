# ===================== Сервер =====================
server.port=8080
spring.application.name=flight-tracker

# ============ Подключение к базе данных PostgreSQL ============
# Адрес БД: jdbc:postgresql://<хост>:<порт>/<имя_базы>
spring.datasource.url=jdbc:postgresql://localhost:8831/flight_tracker
spring.datasource.username=postgres
spring.datasource.password=14528243
spring.datasource.driver-class-name=org.postgresql.Driver

# Пул соединений HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ===================== JPA / Hibernate =====================
# Схему создаёт Flyway, Hibernate только проверяет соответствие сущностей таблицам
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===================== Flyway (миграции) =====================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
